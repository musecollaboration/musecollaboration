<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Александр Терехов — Python Backend: FastAPI, SQLAlchemy, Kafka, Docker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0d151b"/>
      <stop offset="1" stop-color="#0f2024"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#009688"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <circle cx="1300" cy="170" r="260" fill="url(#glow)"/>
  <circle cx="1470" cy="340" r="140" fill="#ffd43b" opacity="0.05" filter="url(#blur)"/>

  <!-- архитектурная схема справа -->
  <g fill="none" stroke-linecap="round">
    <path d="M1090 120 L1195 120 L1195 205 L1310 205" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M1195 205 L1195 292 L1080 292" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="1.5"/>
    <path d="M1310 205 L1310 130 L1440 130" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.5"/>
    <path d="M1310 205 L1310 300 L1430 300" stroke="#ffd43b" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 8"/>
    <path d="M1440 130 L1520 90" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>

  <g>
    <rect x="1035" y="86" width="190" height="112" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#2dd4bf" stroke-opacity="0.38"/>
    <rect x="1225" y="152" width="196" height="118" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <rect x="1405" y="86" width="150" height="92" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#8b949e" stroke-opacity="0.28"/>
    <rect x="1385" y="262" width="150" height="80" rx="14" fill="#ffffff" fill-opacity="0.02" stroke="#ffd43b" stroke-opacity="0.32"/>

    <rect x="1060" y="112" width="92" height="6" rx="3" fill="#2dd4bf" opacity="0.55"/>
    <rect x="1060" y="130" width="140" height="6" rx="3" fill="#8b949e" opacity="0.28"/>
    <rect x="1060" y="148" width="112" height="6" rx="3" fill="#8b949e" opacity="0.2"/>

    <rect x="1250" y="180" width="104" height="6" rx="3" fill="#e6edf3" opacity="0.45"/>
    <rect x="1250" y="198" width="146" height="6" rx="3" fill="#8b949e" opacity="0.26"/>
    <rect x="1250" y="216" width="128" height="6" rx="3" fill="#8b949e" opacity="0.18"/>
    <rect x="1250" y="240" width="60" height="6" rx="3" fill="#ffd43b" opacity="0.55"/>

    <rect x="1428" y="110" width="76" height="6" rx="3" fill="#8b949e" opacity="0.32"/>
    <rect x="1428" y="128" width="100" height="6" rx="3" fill="#8b949e" opacity="0.2"/>
    <rect x="1408" y="284" width="74" height="6" rx="3" fill="#8b949e" opacity="0.3"/>
    <rect x="1408" y="302" width="96" height="6" rx="3" fill="#8b949e" opacity="0.18"/>
  </g>

  <g filter="url(#dot)">
    <circle cx="1090" cy="120" r="4.5" fill="#2dd4bf"/>
    <circle cx="1310" cy="205" r="5" fill="#2dd4bf"/>
    <circle cx="1440" cy="130" r="4" fill="#2dd4bf" opacity="0.8"/>
    <circle cx="1430" cy="300" r="4" fill="#ffd43b" opacity="0.9"/>
    <circle cx="1520" cy="90" r="3" fill="#2dd4bf" opacity="0.5"/>
  </g>

  <!-- текст -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="138" font-size="17" letter-spacing="6" fill="#8b949e">АЛЕКСАНДР ТЕРЕХОВ</text>
    <text x="77" y="212" font-size="64" font-weight="700" letter-spacing="1" fill="#f0f6fc">PYTHON BACKEND</text>
    <rect x="80" y="238" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="296" font-size="19" letter-spacing="3.5" fill="#7d8590">FASTAPI · SQLALCHEMY · KAFKA · DOCKER</text>
    <text x="80" y="334" font-size="16" letter-spacing="0.4" fill="#6e7681">Backend-разработчик · Автор курсов и уроков на Stepik</text>
  </g>

  <rect x="0.5" y="0.5" width="1599" height="399" fill="none" stroke="#30363d" stroke-opacity="0.7"/>
</svg>
